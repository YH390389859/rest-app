ShortDescription: Break reminder that pauses your video, dims every display, and resumes playback afterwards.
Description: >-
  Rest is a desktop break reminder for Windows and macOS. At a configurable interval it pauses
  the media currently playing, covers every display with a translucent countdown overlay showing
  the remaining break time, and resumes playback when the break ends. It uses Bing's daily
  wallpaper as the break backdrop and supports per-monitor DPI on mixed-scaling multi-monitor
  setups. Short and long break cycles can be configured independently. The application collects
  no user data; the only outbound request is downloading the wallpaper image.
