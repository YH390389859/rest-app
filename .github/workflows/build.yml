name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# tag 触发时要往 Releases 里传包
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-latest 现在是 macOS 26 arm64，官方明确标注 arm64 容量紧张：
    # 实测连排队 15 分钟会被直接 cancel。改用 Intel 镜像，通用二进制照样交叉编译出 arm64。
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v7

      - name: 解析版本号
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: 缓存 SwiftPM 构建产物
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: 构建（arm64 + x86_64）
        env:
          UNIVERSAL: "1"
          VERSION: ${{ steps.meta.outputs.version }}
        run: ./build.sh release

      - name: 校验产物
        run: |
          set -euo pipefail
          lipo -info build/Rest.app/Contents/MacOS/Rest
          codesign --verify --strict build/Rest.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/Rest.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Rest.app/Contents/Info.plist

      - name: 打包 zip
        run: |
          set -euo pipefail
          mkdir -p dist
          # 非 tag 构建用 commit 短 SHA 命名，避免同名覆盖
          NAME="${GITHUB_REF_NAME//\//-}"
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then NAME="${GITHUB_SHA::7}"; else NAME="${NAME#v}"; fi
          ditto -c -k --sequesterRsrc --keepParent build/Rest.app "dist/Rest-${NAME}.zip"
          ls -lh dist

      - name: 打包 DMG
        run: |
          set -euo pipefail
          bash tools/make-dmg.sh build/Rest.app dist
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            mv dist/Rest-*.dmg "dist/Rest-${GITHUB_SHA::7}.dmg"
          fi
          # 挂载一次确认镜像可用（比只 verify 更能发现目录结构问题）
          MOUNT="$(mktemp -d)/mnt"
          mkdir -p "$MOUNT"
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT" dist/Rest-*.dmg >/dev/null
          ls -la "$MOUNT"
          test -d "$MOUNT/Rest.app" -a -L "$MOUNT/Applications"
          codesign --verify --strict "$MOUNT/Rest.app"
          hdiutil detach "$MOUNT" -quiet
          ls -lh dist

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: Rest-app
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
