name: build

# 一条流水线同时出 macOS 和 Windows 的包：
#   推 main / 开 PR / 手动触发  → 两个平台都构建，产物作为 artifact 留 30 天
#   推 v* tag                  → 两边都成功后，把 4 个包挂到同一个 Release
#
# 以前是两个独立工作流（build.yml + windows.yml），tag 打下去时各自发各自的 Release，
# 谁先跑完谁的包先上，跑挂一个就变成"半个 Release"。现在合成一个，Release 依赖两边都过。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  # SignPath 的 action 要用 GITHUB_TOKEN 把本次运行的 artifact 下载下来送签
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 版本号只有一个来源：仓库根的 VERSION。tag 必须和它一致，
  # 否则会出现「安装器里写 1.1.0、Release 叫 v1.2.0」这种对不上的情况。
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          set -euo pipefail
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            if [[ "$TAG_VERSION" != "$FILE_VERSION" ]]; then
              echo "::error::tag v$TAG_VERSION 与 VERSION 文件里的 $FILE_VERSION 不一致，先把 VERSION 改对"
              exit 1
            fi
          fi
          echo "version=$FILE_VERSION" >> "$GITHUB_OUTPUT"
          echo "本次版本号：$FILE_VERSION"

  macos:
    needs: version
    # macos-latest 现在是 macOS 26 arm64，官方明确标注 arm64 容量紧张：
    # 实测连排队 15 分钟会被直接 cancel。改用 Intel 镜像，通用二进制照样交叉编译出 arm64。
    runs-on: macos-26-intel
    defaults:
      run:
        working-directory: macos
    env:
      # 有证书就用固定身份签（TCC 授权跨版本保留），没有就退回 ad-hoc
      SIGNING_P12: ${{ secrets.SIGNING_P12 }}
      SIGNING_P12_PASS: ${{ secrets.SIGNING_P12_PASS }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: 导入签名证书
        if: env.SIGNING_P12 != ''
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(uuidgen)"

          # secret 里存的是 base64 过的 p12
          base64 -D -o "$RUNNER_TEMP/cert.p12" <<< "$SIGNING_P12"

          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$SIGNING_P12_PASS" \
            -T /usr/bin/codesign -T /usr/bin/security

          # 少了这一步，codesign 会弹「想要使用钥匙串中的密钥」，CI 上没人能点，直接卡死
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KC_PASS" "$KC" >/dev/null

          # 把临时钥匙串加进搜索列表，codesign 才找得到这个身份
          security list-keychains -d user -s "$KC" \
            $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$KC"

          rm -f "$RUNNER_TEMP/cert.p12"

      - name: 缓存 SwiftPM 构建产物
        uses: actions/cache@v6
        with:
          # actions/cache 的 path 以仓库根为基准，不受 working-directory 影响
          path: macos/.build
          # v2：v1 的缓存是在「仓库根就是包根」时建的，build.db 里的绝对路径已经失效，
          # 恢复回来反而会干扰 SwiftPM，换前缀让它们自然淘汰
          key: ${{ runner.os }}-spm-v2-${{ hashFiles('macos/Package.swift', 'macos/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-v2-

      - name: 构建（arm64 + x86_64）
        env:
          UNIVERSAL: "1"
        run: |
          set -o pipefail
          pwd
          swift --version
          cat ../VERSION
          ./build.sh release 2>&1 | tee "$RUNNER_TEMP/macos-build.log"

      # 失败时把日志尾部打成 annotation：Actions 的原始日志要登录才能下，
      # annotation 通过 check-runs API 就能读到，远程排查时少绕一圈
      - name: 构建失败原因
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/macos-build.log"
          [ -f "$LOG" ] || { echo "::error::构建脚本没有产生日志"; exit 0; }
          tail -n 8 "$LOG" | while IFS= read -r line; do
            line="${line//\%/%25}"; line="${line//$'\r'/}"
            echo "::error::$line"
          done

      - name: 校验产物
        run: |
          set -euo pipefail
          BIN="build/Rest.app/Contents/MacOS/Rest"
          lipo -info "$BIN"

          # Intel runner 上交叉编译，必须确认 arm64 切片真的在：少一个架构就直接失败，
          # 避免哪天有人去掉 UNIVERSAL 后悄悄发出去一个只能在 Intel 上跑的包。
          ARCHS="$(lipo -archs "$BIN")"
          for need in arm64 x86_64; do
            if [[ " $ARCHS " != *" $need "* ]]; then
              echo "!! 产物缺少 $need 架构，实际是: $ARCHS"; exit 1
            fi
          done
          echo "架构检查通过: $ARCHS"

          codesign --verify --strict build/Rest.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/Rest.app/Contents/Info.plist

          # 版本号必须真的写进去了（VERSION 文件 → Info.plist）
          GOT="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Rest.app/Contents/Info.plist)"
          if [[ "$GOT" != "$VERSION" ]]; then
            echo "!! Info.plist 版本号 $GOT 与期望 $VERSION 不一致"; exit 1
          fi
          echo "版本号检查通过: $GOT"

          # 配了证书就必须真的用上了：一旦悄悄退回 ad-hoc，用户的授权又会每次失效
          SIGN_INFO="$(codesign -dv --verbose=2 build/Rest.app 2>&1)"
          echo "$SIGN_INFO" | grep -E "^(Identifier|Authority|Signature)"
          if [[ -n "${SIGNING_P12}" ]]; then
            if ! echo "$SIGN_INFO" | grep -q "Authority=Rest Self Signed"; then
              echo "!! 配了 SIGNING_P12 但产物不是固定证书签名"; exit 1
            fi
            echo "签名身份检查通过"
          else
            echo "未配置签名证书，本次为 ad-hoc 签名"
          fi

      - name: 打包 zip
        run: |
          set -euo pipefail
          mkdir -p dist
          # 非 tag 构建用 commit 短 SHA 命名，避免同名覆盖
          NAME="${GITHUB_REF_NAME//\//-}"
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then NAME="${GITHUB_SHA::7}"; else NAME="${NAME#v}"; fi
          ditto -c -k --sequesterRsrc --keepParent build/Rest.app "dist/Rest-${NAME}.zip"
          ls -lh dist

      - name: 打包 DMG
        run: |
          set -euo pipefail
          bash tools/make-dmg.sh build/Rest.app dist
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            mv dist/Rest-*.dmg "dist/Rest-${GITHUB_SHA::7}.dmg"
          fi
          # 挂载一次确认镜像可用（比只 verify 更能发现目录结构问题）
          MOUNT="$(mktemp -d)/mnt"
          mkdir -p "$MOUNT"
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT" dist/Rest-*.dmg >/dev/null
          ls -la "$MOUNT"
          test -d "$MOUNT/Rest.app" -a -L "$MOUNT/Applications"
          codesign --verify --strict "$MOUNT/Rest.app"
          hdiutil detach "$MOUNT" -quiet
          ls -lh dist

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: Rest-macos
          path: macos/dist/*
          if-no-files-found: error
          retention-days: 30

  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # 本地 PFX 签名通道（买了证书就走这条）
      WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
      WINDOWS_SIGN_PFX_PASS: ${{ secrets.WINDOWS_SIGN_PFX_PASS }}
      # 远程签名通道（SignPath Foundation，开源项目免费）。
      # 三个变量 + 一个 secret 都没配时，下面所有签名步骤自动跳过，
      # 产物就是和以前一样的未签名包——这样审核没下来也能正常构建。
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_POLICY_SLUG: ${{ vars.SIGNPATH_POLICY_SLUG }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 安装 Inno Setup
        shell: pwsh
        run: |
          # windows-latest 镜像不保证带 ISCC，自己装一个最稳
          if (Get-Command ISCC.exe -ErrorAction SilentlyContinue) { return }
          choco install innosetup -y --no-progress
          $iscc = @(
            "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup 安装失败" }
          Write-Host "ISCC: $iscc"

      - name: 还原
        run: dotnet restore Rest.sln

      # 两个平台的节奏模型必须一致，这条红了就别往下打了
      - name: 核心逻辑测试
        run: dotnet test tests/Rest.Core.Tests/Rest.Core.Tests.csproj -c Release --nologo

      - name: 发布（未签名）
        shell: pwsh
        run: |
          # 走 SignPath 时本地不持私钥，必须让 build.ps1 别尝试 signtool；
          # 走 PFX 通道时反过来，由 build.ps1 自己签。
          # 注意 splatting 必须用哈希表：数组展开是「位置参数」，
          # 会把 '-Configuration' 本身当第一个参数传进去，直接 ValidateSet 报错
          $p = @{ Configuration = 'Release'; Version = $env:VERSION }
          if ($env:SIGNPATH_PROJECT_SLUG) { $p.NoSign = $true }
          & .\build.ps1 @p

      # ── 第一轮签名：主程序 + 卸载器 ─────────────────────────────────
      # Inno 的 unins000.exe 是"复制 setup 再改写"出来的，不带签名，
      # 开了智能应用控制的机器能装不能卸。所以先让 ISCC 吐一个待签样本（这一遍
      # 本来就以退出码 2 中止，-SignStub 内部已归零），连同主程序一起送去签。
      - name: 产出待签名卸载器样本
        if: env.SIGNPATH_PROJECT_SLUG != ''
        shell: pwsh
        run: .\build.ps1 -NoPublish -SignStub -Version $env:VERSION

      - name: 打包待签名文件
        if: env.SIGNPATH_PROJECT_SLUG != ''
        shell: pwsh
        run: |
          $stub = Get-ChildItem dist\unins -Filter 'uninst-*.e32' -ErrorAction SilentlyContinue |
                  Select-Object -First 1
          if (-not $stub) { throw "没有待签名的卸载器样本" }

          New-Item -ItemType Directory -Force -Path signin/app | Out-Null
          Copy-Item dist\win-x64\Rest.exe signin/app/Rest.exe
          # SignPath 的 pe-file 只认 .exe/.dll，.e32 改个扩展名再送签；
          # Authenticode 覆盖的是文件内容，回填时改回 .e32 签名照样有效
          $renamed = Join-Path 'signin/app' ($stub.BaseName + '.exe')
          Copy-Item $stub.FullName $renamed

          # 用系统 bsdtar 打 zip（不压缩，送签的是原始字节）
          $zip = Join-Path $PWD 'signin/app.zip'
          Push-Location signin/app
          & "$env:SystemRoot\System32\tar.exe" -a -c -f $zip *
          Pop-Location
          if ($LASTEXITCODE -ne 0) { throw "打包待签名文件失败" }
          Get-ChildItem signin/app | Select-Object Name, Length | Format-Table -AutoSize

      - name: 上传待签名文件
        if: env.SIGNPATH_PROJECT_SLUG != ''
        id: upload-app
        uses: actions/upload-artifact@v7
        with:
          name: rest-unsigned-app
          path: windows/signin/app.zip
          retention-days: 1
          if-no-files-found: error

      - name: SignPath 签名（主程序 + 卸载器）
        if: env.SIGNPATH_PROJECT_SLUG != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          output-artifact-directory: windows/signed/app

      - name: 回填已签名的主程序与卸载器
        if: env.SIGNPATH_PROJECT_SLUG != ''
        shell: pwsh
        run: |
          Copy-Item signed/app/Rest.exe dist\win-x64\Rest.exe -Force
          $signedStub = Get-ChildItem signed/app -Filter 'uninst-*.exe' -ErrorAction SilentlyContinue |
                        Select-Object -First 1
          if (-not $signedStub) { throw "签名结果里没有卸载器样本" }
          Copy-Item $signedStub.FullName (Join-Path dist\unins ($signedStub.BaseName + '.e32')) -Force
          Get-AuthenticodeSignature dist\win-x64\Rest.exe | Select-Object Status, StatusMessage | Format-List

      # ── 编译安装器（内嵌已签名的主程序 + 已签名卸载器）──────────────
      - name: 编译安装器
        shell: pwsh
        run: |
          $p = @{ NoPublish = $true; Installer = $true; Version = $env:VERSION }
          if ($env:SIGNPATH_PROJECT_SLUG) {
            # 远程签名：本地签不了，内嵌已签好的卸载器副本
            $p.NoSign = $true
            $p.SignUninstaller = $true
          }
          & .\build.ps1 @p

      # ── 第二轮签名：安装器本体 ─────────────────────────────────────
      # Inno Setup 不是 SignPath 支持的复合格式（不像 MSI 能深签），
      # 所以内层文件必须在这一步之前签好，这里只签 setup.exe
      - name: 打包待签名安装器
        if: env.SIGNPATH_PROJECT_SLUG != ''
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter 'Rest-*-win-x64-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw "没有生成安装器" }
          New-Item -ItemType Directory -Force -Path signin/installer | Out-Null
          Copy-Item $setup.FullName signin/installer/
          $zip = Join-Path $PWD 'signin/installer.zip'
          Push-Location signin/installer
          & "$env:SystemRoot\System32\tar.exe" -a -c -f $zip *
          Pop-Location
          if ($LASTEXITCODE -ne 0) { throw "打包待签名安装器失败" }
          Get-ChildItem signin/installer | Select-Object Name, Length | Format-Table -AutoSize

      - name: 上传待签名安装器
        if: env.SIGNPATH_PROJECT_SLUG != ''
        id: upload-installer
        uses: actions/upload-artifact@v7
        with:
          name: rest-unsigned-installer
          path: windows/signin/installer.zip
          retention-days: 1
          if-no-files-found: error

      - name: SignPath 签名（安装器）
        if: env.SIGNPATH_PROJECT_SLUG != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          output-artifact-directory: windows/signed/installer

      - name: 回填已签名安装器
        if: env.SIGNPATH_PROJECT_SLUG != ''
        shell: pwsh
        run: |
          Get-ChildItem signed/installer -Filter '*.exe' | ForEach-Object {
            Copy-Item $_.FullName (Join-Path 'dist' $_.Name) -Force
            Get-AuthenticodeSignature (Join-Path 'dist' $_.Name) | Select-Object Status | Format-List
          }

      # 便携包必须最后打：里面的 Rest.exe 是中途被换成已签名版本的
      - name: 打包便携包
        shell: pwsh
        run: .\build.ps1 -NoPublish -NoSign -Zip -Version $env:VERSION

      - name: 产物断言
        shell: pwsh
        run: |
          $exe = 'dist/win-x64/Rest.exe'
          if (-not (Test-Path $exe)) { throw "缺少 $exe" }
          if ((Get-Item $exe).Length -lt 100KB) { throw "Rest.exe 太小，可能是空壳" }
          $ver = (Get-Item $exe).VersionInfo.ProductVersion
          Write-Host "Rest.exe 版本资源: $ver"
          if ($ver -notlike "$env:VERSION*") { throw "版本资源 $ver 与期望不符" }

          $setup = Get-ChildItem dist/Rest-*-setup.exe -ErrorAction SilentlyContinue
          if (-not $setup) { throw "没有生成安装器" }
          Write-Host "安装器: $($setup.Name) $([math]::Round($setup.Length/1MB,1)) MB"

          # 配了签名通道就必须真的签上，不能悄悄发未签名包
          if ($env:SIGNPATH_PROJECT_SLUG -or $env:WINDOWS_SIGN_PFX_BASE64) {
            foreach ($f in $exe, $setup.FullName) {
              $sig = Get-AuthenticodeSignature $f
              Write-Host "$([System.IO.Path]::GetFileName($f)) 签名: $($sig.Status) / $($sig.SignerCertificate.Subject)"
              if ($sig.Status -ne 'Valid') { throw "签名无效：$f -> $($sig.Status)" }
            }
          }
          else { Write-Host "未配置签名通道，本次产物未签名" }

      # 安装器不能只"编译通过"就算完：静默装一遍、跑一次、再卸掉。
      # 这一步能抓到 [Files] 路径写错、安装后缺文件、卸载残留这类问题。
      - name: 安装器冒烟测试
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist/Rest-*-setup.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:TEMP 'rest-install-smoke'
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }

          $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList `
               '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS', "/DIR=$dir"
          Write-Host "安装退出码: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "静默安装失败：$($p.ExitCode)" }

          foreach ($f in 'Rest.exe', 'Rest.Core.dll', 'unins000.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "安装目录缺少 $f" }
          }
          Write-Host "安装文件数: $((Get-ChildItem $dir -Recurse -File).Count)"

          # 卸载器的签名是安装时从内嵌副本带过来的，这里顺手确认它真的带上了：
          # 少了这一步，开了 SAC 的用户能装不能卸
          if ($env:SIGNPATH_PROJECT_SLUG -or $env:WINDOWS_SIGN_PFX_BASE64) {
            $u = Get-AuthenticodeSignature (Join-Path $dir 'unins000.exe')
            Write-Host "卸载器签名: $($u.Status) / $($u.SignerCertificate.Subject)"
            if ($u.Status -ne 'Valid') { throw "卸载器没有有效签名：$($u.Status)" }
          }

          $t = Start-Process -FilePath (Join-Path $dir 'Rest.exe') -ArgumentList '--self-test' `
                             -Wait -PassThru -NoNewWindow
          if ($t.ExitCode -ne 0) { throw "已安装副本自检失败：$($t.ExitCode)" }
          Write-Host "已安装副本自检通过"

          $u2 = Start-Process -FilePath (Join-Path $dir 'unins000.exe') -Wait -PassThru `
                             -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($u2.ExitCode -ne 0) { throw "卸载失败：$($u2.ExitCode)" }

          # 卸载器会把自己复制到临时目录再干活，Start-Process 返回时文件可能还没删完，
          # 所以轮询等目录消失，别用固定 sleep 赌
          $gone = $false
          for ($i = 0; $i -lt 30; $i++) {
            if (-not (Test-Path (Join-Path $dir 'Rest.exe'))) { $gone = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $gone) { throw "卸载 30 秒后 Rest.exe 还在：$dir" }
          Write-Host "卸载干净"

      - uses: actions/upload-artifact@v7
        with:
          name: Rest-windows
          path: |
            windows/dist/Rest-*-win-x64-portable.zip
            windows/dist/Rest-*-win-x64-setup.exe
          if-no-files-found: error
          retention-days: 30

  release:
    # 只有 tag 才发 Release，而且必须两个平台都成功——避免"半个 Release"
    needs: [version, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 汇总两个平台的产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 列出待发布文件
        run: ls -lh dist

      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
