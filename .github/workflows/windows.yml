name: windows

on:
  push:
    branches: [main, feat/windows-port]
    # tag 打包时也要出 Windows 包，否则 macOS 的 Release 里只有 dmg/zip，缺一半
    # （path 过滤不作用于 tag push，不会因为只改文档就被跳过）
    tags: ["v*"]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 还原
        run: dotnet restore Rest.sln

      # 先跑逻辑测试：两个平台的节奏模型必须一致，这条红了就别往下打了
      - name: 核心逻辑测试
        run: dotnet test tests/Rest.Core.Tests/Rest.Core.Tests.csproj -c Release --nologo

      - name: 发布 win-x64
        run: >
          dotnet publish src/Rest.App/Rest.App.csproj
          -c Release -r win-x64 --self-contained true
          -o dist/win-x64

      - name: 产物断言
        shell: pwsh
        run: |
          $exe = 'dist/win-x64/Rest.exe'
          if (-not (Test-Path $exe)) { throw "缺少 $exe" }
          $size = (Get-Item $exe).Length
          Write-Host "Rest.exe $size bytes"
          if ($size -lt 100KB) { throw "Rest.exe 太小，可能是空壳" }

      - name: 无界面自检
        shell: pwsh
        run: |
          # Rest.exe 是 WinExe（GUI 子系统），PowerShell 用 & 调用不会等它结束，
          # $LASTEXITCODE 拿到的是上一条命令的，必须用 -Wait -PassThru 取真实退出码
          $p = Start-Process -FilePath 'dist\win-x64\Rest.exe' -ArgumentList '--self-test' `
                             -Wait -PassThru -NoNewWindow
          Write-Host "exit=$($p.ExitCode)"
          $log = Join-Path $env:TEMP 'rest-debug.log'
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { throw "自检失败（exit=$($p.ExitCode)）" }

      - name: 打包
        shell: pwsh
        run: Compress-Archive -Path dist/win-x64/* -DestinationPath dist/Rest-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Rest-windows-x64
          path: windows/dist/Rest-win-x64.zip
          retention-days: 30

      # tag 推上去时和 macOS 的工作流共用同一个 Release，两边的包并排挂着
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: windows/dist/Rest-win-x64.zip
          fail_on_unmatched_files: true
